# Production stack, deployed as docker-compose.yml by the infra admin, who also owns a
# docker-compose.override.yml next to it (compose loads it on its own -- run `docker compose up -d`
# without -f). A push to `main` needs none of this: CI publishes the images to GHCR and the
# production host rolls out web/api within minutes.
#
# This stack only pulls prebuilt images from GHCR; do not add `build:` blocks (no repo checkout on
# the server). Relative paths (./uploads, ./cache, ./db) resolve next to the deployed file.
#
# No host port: a reverse proxy in front of the stack terminates HTTPS and reaches carnaby-web:3000
# (the infra admin's override wires that up). Web calls the API as http://api:3001.
#
# Explicit project name -- same collision class documented in docker-compose.dev.yml and
# docker-compose.local-prod.yml (Task 25 incident): without `name:`, compose infers the project
# name from the directory. Pinning it also makes a local `docker compose -f
# docker/docker-compose.prod.yml config` dry-run safe next to `carnaby-dev` / `carnaby-local-prod`.
name: carnaby-sk

services:
  web:
    image: ghcr.io/carnaby/carnaby-web:${TAG:-dev}
    container_name: carnaby-web
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      # Runtime copy of API_INTERNAL_URL -- lib/trpc-server.ts and lib/session.ts read it from
      # process.env on every server-side fetch. It must match this compose file's `api` service
      # name (it does: http://api:3001). This does NOT replace the build-time ARG of the same
      # name baked into the image by CI (Task 27) -- next.config.js's rewrites() and the static
      # robots.txt/sitemap.xml are frozen at build and ignore this runtime value; see
      # docker/web.Dockerfile and docker/docker-compose.local-prod.yml for the full explanation.
      # Both the build-time and runtime copies are required; this is the runtime half.
      - API_INTERNAL_URL=http://api:3001
      - APP_URL=${APP_URL}
      # NEXT_PUBLIC_-prefixed vars are inlined by Next.js at BUILD time, not read at container
      # runtime. Task 27 CI passes NEXT_PUBLIC_UMAMI_WEBSITE_ID and NEXT_PUBLIC_UMAMI_SRC as
      # build-args to docker/web.Dockerfile, so the values are baked into the image and Umami
      # analytics fires correctly in the deployed CI-built image. These runtime env lines are
      # informational/documentation only; the active values come from the build-time baked-in
      # values (see docker/web.Dockerfile and docker/docker-compose.local-prod.yml for full
      # explanation of build-time vs. runtime semantics).
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID}
      - NEXT_PUBLIC_UMAMI_SRC=https://analytics.carnaby.sk/script.js
    depends_on:
      api: { condition: service_healthy }
    networks: [carnaby-v2]
    labels: ['com.centurylinklabs.watchtower.enable=true']
    # infra-admin (services): healthcheck timing is set by the operator; do not change it in this project.
    # Only the interval is set; the check itself comes from the image.
    healthcheck:
      interval: 30m

  api:
    image: ghcr.io/carnaby/carnaby-api:${TAG:-dev}
    container_name: carnaby-api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://carnaby:${DB_PASSWORD}@db:5432/carnaby
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # Optional fixed bearer token for MCP clients that can't do OAuth (see docs/mcp.md).
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}
      # YouTube sync in /admin/youtube and the MCP youtube tools (see docs/youtube.md).
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_CHANNELS=${YOUTUBE_CHANNELS:-}
      - APP_URL=${APP_URL}
      - UPLOADS_DIR=/data/uploads
      - CACHE_DIR=/data/cache
    volumes:
      - ./uploads:/data/uploads
      - ./cache:/data/cache
    depends_on:
      db: { condition: service_healthy }
    networks: [carnaby-v2]
    # infra-admin (services): healthcheck timing is set by the operator; do not change it in this project.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health || exit 1']
      interval: 2m
      timeout: 3s
      retries: 3
      start_period: 20s
    labels: ['com.centurylinklabs.watchtower.enable=true']

  db:
    image: postgres:17-alpine
    container_name: carnaby-db
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - POSTGRES_DB=carnaby
      - POSTGRES_USER=carnaby
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data
    networks: [carnaby-v2]
    # infra-admin (services): healthcheck timing is set by the operator; do not change it in this project.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carnaby -d carnaby']
      interval: 2m
      timeout: 5s
      retries: 5

networks:
  carnaby-v2:
    driver: bridge
