# Explicit project name -- MUST stay distinct from docker-compose.dev.yml's `name: carnaby-dev`.
# Both files live in this same directory, and without `name:` compose infers the project name
# from the directory ("docker") for BOTH, making their `db` services the same resource: `up` on
# this file then recreates (removes!) the dev db container. That collision actually happened on
# 2026-07-10 -- see the incident note in docker-compose.dev.yml.
name: carnaby-local-prod

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      # Build-time copies: next.config.js's rewrites() (which interpolate API_INTERNAL_URL) and
      # the static /robots.txt + /sitemap.xml (which bake APP_URL) are frozen into the image by
      # `output: 'standalone'` at `next build` -- see docker/web.Dockerfile.
      args:
        API_INTERNAL_URL: http://api:3001
        APP_URL: http://localhost:3100
    container_name: carnaby-local-prod-web
    ports: ['3100:3000']
    environment:
      - NODE_ENV=production
      # Runtime copies of the same two vars: `lib/trpc-server.ts` and `lib/session.ts` read
      # API_INTERNAL_URL from process.env on every server-side fetch (falling back to
      # localhost:3001 -> ECONNREFUSED inside the container when unset -- observed, not
      # hypothetical), and dynamically-rendered pages read APP_URL for canonical/OG URLs. The
      # build args above do NOT cover these.
      - API_INTERNAL_URL=http://api:3001
      - APP_URL=http://localhost:3100
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: carnaby-local-prod-api
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://carnaby:carnaby@db:5432/carnaby
      - BETTER_AUTH_SECRET=local-prod-secret-not-for-real-use
      - ADMIN_EMAILS=dodusik@gmail.com
      - APP_URL=http://localhost:3100
      - UPLOADS_DIR=/data/uploads
      - CACHE_DIR=/data/cache
    volumes:
      - ./.data/uploads:/data/uploads
      - ./.data/cache:/data/cache
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    container_name: carnaby-local-prod-db
    environment:
      POSTGRES_USER: carnaby
      POSTGRES_PASSWORD: carnaby
      POSTGRES_DB: carnaby
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carnaby']
      interval: 5s
      timeout: 5s
      retries: 10
