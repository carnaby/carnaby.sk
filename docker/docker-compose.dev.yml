services:
  db:
    image: postgres:17-alpine
    container_name: carnaby-db-local
    environment:
      POSTGRES_USER: carnaby
      POSTGRES_PASSWORD: carnaby
      POSTGRES_DB: carnaby
    ports: ['5432:5432']
    volumes: [carnaby-db-local:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carnaby']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  carnaby-db-local:
